<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>OX 정답노트</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F6F1E4;
    --paper-line: #E1D8BE;
    --ink: #2A2823;
    --ink-soft: #6B6455;
    --o-green: #2F6B4F;
    --o-green-deep: #1F4C37;
    --x-red: #B23A2E;
    --x-red-deep: #862A21;
    --gold: #C08A28;
    --card-shadow: 0 18px 40px rgba(42,40,35,0.14);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(192,138,40,0.07), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(47,107,79,0.07), transparent 40%),
      var(--paper);
    font-family:'Noto Sans KR', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:32px 16px 60px;
  }
  .app{
    width:100%;
    max-width:560px;
  }
  .masthead{
    text-align:center;
    margin-bottom:20px;
  }
  .masthead .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.28em;
    color:var(--ink-soft);
    text-transform:uppercase;
  }
  .masthead h1{
    font-family:'Black Han Sans', sans-serif;
    font-size:44px;
    margin:6px 0 2px;
    letter-spacing:0.02em;
    color:var(--ink);
  }
  .masthead h1 span{ color:var(--x-red); }
  .masthead p{
    font-size:13.5px;
    color:var(--ink-soft);
    margin:0;
  }

  .tabs{
    display:flex;
    gap:8px;
    margin:22px 0 18px;
    border-bottom:2px solid var(--paper-line);
  }
  .tab{
    flex:1;
    padding:11px 0;
    text-align:center;
    font-weight:700;
    font-size:14.5px;
    color:var(--ink-soft);
    background:none;
    border:none;
    cursor:pointer;
    position:relative;
    letter-spacing:0.01em;
  }
  .tab.active{ color:var(--ink); }
  .tab.active::after{
    content:"";
    position:absolute;
    left:10%; right:10%; bottom:-2px;
    height:3px;
    background:var(--gold);
    border-radius:2px;
  }

  .card{
    background:#FFFDF7;
    border:1px solid var(--paper-line);
    border-radius:14px;
    box-shadow:var(--card-shadow);
    padding:26px 24px 30px;
    position:relative;
    background-image: repeating-linear-gradient(to bottom, transparent 0 37px, var(--paper-line) 37px 38px);
    background-position: 0 68px;
  }
  .card::before{ content:none; }
  .torn{
    height:14px;
    margin:0 -1px -1px;
    background:
      linear-gradient(135deg, #FFFDF7 25%, transparent 25%) -6px 0/12px 12px repeat-x,
      linear-gradient(-135deg, #FFFDF7 25%, transparent 25%) -6px 0/12px 12px repeat-x;
    border:1px solid var(--paper-line);
    border-top:none;
    border-radius:0 0 14px 14px;
  }

  /* ---- Solve tab ---- */
  .score-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:14px;
  }
  .score-row b{ color:var(--ink); font-size:14px; }
  .q-num{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--gold);
    font-weight:600;
    margin-bottom:8px;
  }
  .q-text{
    font-size:20px;
    line-height:1.55;
    font-weight:700;
    min-height:80px;
    margin-bottom:22px;
  }
  .choice-row{
    display:flex;
    gap:16px;
    justify-content:center;
    margin:8px 0 6px;
  }
  .choice-btn{
    width:104px; height:104px;
    border-radius:50%;
    border:4px solid var(--ink);
    background:#fff;
    font-family:'Black Han Sans', sans-serif;
    font-size:44px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
    color:var(--ink);
  }
  .choice-btn:hover{ transform:translateY(-3px); box-shadow:0 8px 18px rgba(0,0,0,0.12); }
  .choice-btn.o{ border-color:var(--o-green); color:var(--o-green-deep); }
  .choice-btn.x{ border-color:var(--x-red); color:var(--x-red-deep); }
  .choice-btn:disabled{ cursor:default; opacity:0.55; transform:none; box-shadow:none; }

  .stamp-zone{
    position:relative;
    min-height:170px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
  }
  .stamp{
    font-family:'Black Han Sans', sans-serif;
    font-size:96px;
    line-height:1;
    transform:rotate(-14deg) scale(0.3);
    opacity:0;
    animation: stampIn .32s cubic-bezier(.2,1.4,.5,1) forwards;
  }
  .stamp.correct{ color:var(--o-green); text-shadow:0 3px 0 rgba(31,76,55,0.25); }
  .stamp.wrong{ color:var(--x-red); text-shadow:0 3px 0 rgba(134,42,33,0.25); }
  @keyframes stampIn{
    0%{ transform:rotate(-14deg) scale(0.3); opacity:0; }
    60%{ transform:rotate(-8deg) scale(1.12); opacity:1; }
    100%{ transform:rotate(-8deg) scale(1); opacity:1; }
  }
  .feedback-text{
    font-size:14px;
    color:var(--ink-soft);
    text-align:center;
    max-width:400px;
    line-height:1.6;
  }
  .next-btn, .primary-btn{
    display:block;
    margin:20px auto 0;
    background:var(--ink);
    color:#FFFDF7;
    border:none;
    padding:12px 28px;
    border-radius:999px;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    font-family:'Noto Sans KR', sans-serif;
  }
  .next-btn:hover, .primary-btn:hover{ background:#000; }

  .empty-state{
    text-align:center;
    padding:36px 10px;
    color:var(--ink-soft);
    font-size:14.5px;
    line-height:1.7;
  }
  .empty-state b{ color:var(--ink); }

  .result-wrap{ text-align:center; padding:14px 0 4px; }
  .result-wrap .big{
    font-family:'Black Han Sans', sans-serif;
    font-size:56px;
    margin:6px 0;
  }
  .result-wrap .big .o{ color:var(--o-green); }
  .result-wrap .big .slash{ color:var(--paper-line); }
  .spider-anim{ position:relative; width:100%; height:110px; display:flex; align-items:center; justify-content:center; margin:6px 0; }
  .web-burst, .web-torn{ position:absolute; width:170px; height:auto; animation: webPulse 1.6s ease-in-out infinite; }
  .spider-emoji{ position:relative; font-size:40px; animation: dropIn .5s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes webPulse{ 0%,100%{ opacity:0.7; transform:scale(1); } 50%{ opacity:1; transform:scale(1.04); } }
  @keyframes dropIn{ 0%{ transform:translateY(-30px) rotate(-15deg); opacity:0; } 100%{ transform:translateY(0) rotate(0deg); opacity:1; } }

  /* ---- Manage tab ---- */
  .field{ margin-bottom:16px; }
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:6px;
    letter-spacing:0.02em;
  }
  textarea, input[type=text]{
    width:100%;
    border:1.5px solid var(--paper-line);
    border-radius:8px;
    padding:10px 12px;
    font-family:'Noto Sans KR', sans-serif;
    font-size:14.5px;
    resize:vertical;
    background:#fff;
    color:var(--ink);
  }
  textarea:focus, input[type=text]:focus{ outline:2px solid var(--gold); outline-offset:1px; border-color:var(--gold); }
  .ox-toggle{ display:flex; gap:10px; }
  .ox-toggle button{
    flex:1;
    padding:10px 0;
    border-radius:8px;
    border:1.5px solid var(--paper-line);
    background:#fff;
    font-family:'Black Han Sans', sans-serif;
    font-size:20px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .ox-toggle button.sel-o{ border-color:var(--o-green); color:var(--o-green-deep); background:#EFF6F1; }
  .ox-toggle button.sel-x{ border-color:var(--x-red); color:var(--x-red-deep); background:#FBEFED; }
  .video-time-row{ display:flex; gap:12px; }
  .video-time-row > div{ flex:1; }
  .video-wrap{
    position:relative;
    width:100%;
    padding-top:56.25%;
    margin-bottom:16px;
    border-radius:10px;
    overflow:hidden;
    border:1.5px solid var(--paper-line);
    background:#000;
  }
  .video-wrap iframe{
    position:absolute; top:0; left:0; width:100%; height:100%; border:none;
  }
  .video-badge{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--gold);
    border:1px solid var(--gold);
    border-radius:999px;
    padding:2px 8px;
    margin-bottom:6px;
  }

  .q-list{ margin-top:22px; border-top:2px solid var(--paper-line); padding-top:16px; }
  .q-list h3{
    font-size:12.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 12px;
  }
  .q-item{
    display:flex;
    gap:12px;
    align-items:flex-start;
    padding:12px 0;
    border-bottom:1px dashed var(--paper-line);
  }
  .q-item:last-child{ border-bottom:none; }
  .q-item .badge{
    flex:0 0 30px;
    height:30px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Black Han Sans', sans-serif;
    font-size:16px;
    border:2px solid;
  }
  .q-item .badge.o{ border-color:var(--o-green); color:var(--o-green-deep); }
  .q-item .badge.x{ border-color:var(--x-red); color:var(--x-red-deep); }
  .q-item .body{ flex:1; }
  .q-item .qt{ font-size:14.5px; font-weight:500; line-height:1.5; }
  .q-item .expl{ font-size:12.5px; color:var(--ink-soft); margin-top:3px; }
  .q-item .del{
    flex:0 0 auto;
    background:none;
    border:1px solid var(--paper-line);
    color:var(--ink-soft);
    border-radius:7px;
    padding:6px 10px;
    font-size:12px;
    cursor:pointer;
  }
  .q-item .del:hover{ border-color:var(--x-red); color:var(--x-red-deep); }

  .status-line{
    font-size:12px;
    color:var(--ink-soft);
    text-align:center;
    margin-top:14px;
    font-family:'IBM Plex Mono', monospace;
  }
  .shared-note{
    font-size:11.5px;
    color:var(--ink-soft);
    background:#FBF2DC;
    border:1px solid #EBD9A6;
    border-radius:8px;
    padding:8px 12px;
    margin-bottom:16px;
    line-height:1.55;
  }
</style>
</head>
<body>
<div class="app">
  <div class="masthead">
    <div class="eyebrow">TRUE OR FALSE · QUIZ SHEET</div>
    <h1>OX <span>정답</span>노트</h1>
    <p>문제를 등록하고, 링크 하나로 풀어보는 OX 시험지</p>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="solve">✎ 문제 풀기</button>
    <button class="tab" data-tab="manage">🗂 문제 관리</button>
  </div>

  <div class="card" id="solveCard">
    <div id="solveBody"></div>
  </div>
  <div class="torn"></div>

  <div id="manageLock" style="display:none;">
    <div class="card">
      <div class="q-num" style="margin-bottom:14px;">관리자 확인</div>
      <div class="field">
        <label>비밀번호</label>
        <input type="text" id="inputPw" placeholder="비밀번호를 입력하세요" autocomplete="off">
      </div>
      <button class="primary-btn" id="btnUnlock">확인</button>
      <div class="status-line" id="pwStatus"></div>
    </div>
  </div>

  <div id="manageCard" style="display:none;">
    <div class="card">
      <div class="shared-note">추가·삭제한 문제는 <b>이 브라우저에만 저장</b>돼요. 다른 기기나 다른 사람의 화면에는 반영되지 않아요.</div>
      <div class="field">
        <label>문제 내용</label>
        <textarea id="inputQuestion" rows="2" placeholder="예: 대한민국의 수도는 부산이다."></textarea>
      </div>
      <div class="field">
        <label>정답</label>
        <div class="ox-toggle">
          <button type="button" id="btnPickO">O</button>
          <button type="button" id="btnPickX">X</button>
        </div>
      </div>
      <div class="field">
        <label>해설 (선택)</label>
        <input type="text" id="inputExpl" placeholder="정답 확인 후 보여줄 짧은 설명">
      </div>
      <div class="field">
        <label>유튜브 영상 (선택 · 짧은 구간만 재생돼요)</label>
        <input type="text" id="inputVideoUrl" placeholder="예: https://www.youtube.com/watch?v=xxxxxxxxxxx">
      </div>
      <div class="field video-time-row">
        <div>
          <label>시작 (초)</label>
          <input type="text" id="inputVideoStart" placeholder="예: 12">
        </div>
        <div>
          <label>종료 (초)</label>
          <input type="text" id="inputVideoEnd" placeholder="예: 17">
        </div>
      </div>
      <button class="primary-btn" id="btnAdd">+ 문제 추가하기</button>
      <div class="status-line" id="addStatus"></div>

      <div class="q-list">
        <h3 id="listTitle">등록된 문제</h3>
        <div id="qList"></div>
        <button class="primary-btn" id="btnReset" style="background:#8a8578; margin-top:18px;">↺ 기본 문제로 초기화</button>
      </div>
    </div>
  </div>
</div>

<script>
const STORE_KEY = 'ox-questions';

const DEFAULT_QUESTIONS = [
  { id:'d1', text:'스파이더맨: 브랜드 뉴 데이는 스파이더맨: 노 웨이 홈 이후 4년이 지난 시점을 배경으로 한다.', answer:'O', explanation:'공식 시놉시스에 스파이더맨: 노 웨이 홈으로부터 4년 뒤 이야기라고 명시돼 있어요.' },
  { id:'d2', text:'스파이더맨: 브랜드 뉴 데이에서 뉴욕 사람들은 이제 피터 파커가 스파이더맨이라는 사실과 그의 이름을 모두 기억하고 있다.', answer:'X', explanation:'스파이더맨: 노 웨이 홈 결말에서 기억이 지워져, 더 이상 그의 이름을 모르는 뉴욕에서 살아가요.' },
  { id:'d3', text:'스파이더맨: 브랜드 뉴 데이에서 피터는 사랑하는 사람들의 기억 속에서 스스로를 지운 채 완전히 혼자 살아간다.', answer:'O', explanation:'공식 시놉시스에 나오는 설정이에요.' },
  { id:'d4', text:'스파이더맨: 브랜드 뉴 데이에서 피터는 도시를 지키는 일에 모든 것을 바친 이른바 "풀타임 스파이더맨"으로 살아간다.', answer:'O', explanation:'공식 시놉시스의 표현이에요.' },
  { id:'d5', text:'스파이더맨: 브랜드 뉴 데이에서 점점 커지는 책임과 압박감이 피터의 몸에 예상치 못한 변화를 일으키기 시작한다.', answer:'O', explanation:'이 변화가 피터의 존재 자체를 위협하는 요소로 이어져요.' },
  { id:'d6', text:'스파이더맨: 브랜드 뉴 데이에서 피터는 지금까지 맞서온 것 중 가장 강력한 새로운 위협과 마주하게 된다.', answer:'O', explanation:'공식 시놉시스에서 "가장 강력한 위협이 모습을 드러낸다"고 밝히고 있어요.' },
  { id:'d7', text:'스파이더맨: 브랜드 뉴 데이 속 새로운 연쇄 범죄 사건들은 서로 아무 관련이 없다.', answer:'X', explanation:'공식 시놉시스는 이 사건들을 "기묘하게 얽힌" 연쇄 범죄로 설명해요.' },
  { id:'d8', text:'스파이더맨: 브랜드 뉴 데이의 이야기는 피터가 완전히 평범한 삶으로 돌아가는 데 성공하며 시작된다.', answer:'X', explanation:'반대로 그는 모두의 기억에서 지워진 채 철저히 혼자인 상태에서 이야기가 시작돼요.' },

  { id:'d9', text:'스파이더맨: 노 웨이 홈은 미스테리오가 피터의 정체를 세상에 폭로한 직후를 배경으로 한다.', answer:'O', explanation:'전작 스파이더맨: 파 프롬 홈 결말의 폭로 사건 바로 다음 이야기예요.' },
  { id:'d10', text:'스파이더맨: 노 웨이 홈에서 피터는 닥터 스트레인지에게 세상 모든 사람이 자신의 정체를 잊게 해달라고 부탁한다.', answer:'O', explanation:'이 부탁에서 이야기가 본격적으로 시작돼요.' },
  { id:'d11', text:'스파이더맨: 노 웨이 홈에서 닥터 스트레인지의 주문은 아무 문제 없이 깔끔하게 성공한다.', answer:'X', explanation:'주문 도중 문제가 생기면서 다른 세계관의 존재들이 넘어오게 돼요.' },
  { id:'d12', text:'스파이더맨: 노 웨이 홈에서 주문이 잘못되면서 다른 세계관의 빌런들이 이 세계로 넘어온다.', answer:'O', explanation:'그린 고블린, 닥터 옥토퍼스 등 이전 스파이더맨 영화들의 빌런들이 등장해요.' },
  { id:'d13', text:'스파이더맨: 노 웨이 홈에는 오직 한 명의 스파이더맨만 등장한다.', answer:'X', explanation:'톰 홀랜드 외에 다른 두 세계관의 스파이더맨도 함께 등장해요.' },
  { id:'d14', text:'스파이더맨: 노 웨이 홈에서 메이 숙모는 마지막 전투 도중 목숨을 잃는다.', answer:'O', explanation:'이 사건이 이후 시리즈의 중요한 배경이 돼요.' },
  { id:'d15', text:'스파이더맨: 노 웨이 홈 마지막에서 피터는 스트레인지에게 부탁해 세상 모든 사람의 기억에서 자신을 완전히 지운다.', answer:'O', explanation:'이 선택 때문에 스파이더맨: 브랜드 뉴 데이에서 아무도 그를 기억하지 못하는 상태로 이어져요.' },

  { id:'d16', text:'아래 영상은 스파이더맨: 브랜드 뉴 데이 공식 예고편의 시작 부분이다. 이 예고편은 마블 스튜디오 로고로 시작한다.', answer:'O', explanation:'마블 스튜디오 작품 예고편은 거의 항상 도입부에 마블 스튜디오 로고가 나와요.', video:{ id:'KRarob7gwC4', start:0, end:5 } },

  { id:'d17', text:'아래 영상은 스파이더맨: 브랜드 뉴 데이 공식 예고편의 한 장면이다. 이 장면에서 스파이더맨은 헐크를 처음 만난다.', answer:'X', explanation:'둘은 이전 시리즈에서 이미 만난 적이 있어요.', video:{ id:'KRarob7gwC4', start:106, end:112 } }
];

let questions = [];
let quizOrder = [];
let quizIdx = 0;
let score = 0;
let answeredCurrent = false;
let picked = null; // for add form

const solveBody = document.getElementById('solveBody');
const qList = document.getElementById('qList');
const listTitle = document.getElementById('listTitle');
const addStatus = document.getElementById('addStatus');

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

async function loadQuestions(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw === null){
      questions = DEFAULT_QUESTIONS.slice();
      localStorage.setItem(STORE_KEY, JSON.stringify(questions));
    }else{
      questions = JSON.parse(raw);
    }
  }catch(e){
    questions = DEFAULT_QUESTIONS.slice();
  }
}

async function saveQuestions(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(questions));
    return true;
  }catch(e){
    return false;
  }
}

function startQuiz(){
  quizOrder = shuffle(questions);
  quizIdx = 0;
  score = 0;
  answeredCurrent = false;
  renderSolve();
}

function renderSolve(){
  if(questions.length === 0){
    solveBody.innerHTML = `
      <div class="empty-state">
        <b>아직 등록된 문제가 없어요.</b><br>
        위 탭에서 <b>'문제 관리'</b>로 이동해 OX 문제를 추가해보세요.
      </div>`;
    return;
  }
  if(quizOrder.length === 0){ startQuiz(); return; }

  if(quizIdx >= quizOrder.length){
    const passed = score >= 15;
    solveBody.innerHTML = `
      <div class="result-wrap">
        <div class="eyebrow" style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.2em;color:var(--ink-soft);">RESULT</div>
        <div class="big"><span class="o">${score}</span><span class="slash"> / </span>${quizOrder.length}</div>
        ${passed ? spiderPassAnim() : spiderFailAnim()}
        <div class="feedback-text" style="font-size:17px; font-weight:700; margin-top:6px; color:${passed?'var(--o-green-deep)':'var(--x-red-deep)'};">
          ${passed ? '당신은 이제 스파이더맨: 브랜드 뉴 데이를 볼 자격이 있습니다' : '당신은 아직 자격이 없습니다'}
        </div>
        <div class="feedback-text">${passed ? '15문제 이상 맞혔어요. 팬이라면 인정!' : '15문제 이상 맞혀야 자격이 주어져요. 다시 도전해볼까요?'}</div>
        <button class="primary-btn" id="btnRetry">다시 풀기</button>
      </div>`;
    document.getElementById('btnRetry').onclick = startQuiz;
    return;
  }

  const q = quizOrder[quizIdx];
  solveBody.innerHTML = `
    <div class="score-row">
      <span>SCORE <b>${score}</b> / ${quizIdx}</span>
      <span>문제 <b>${quizIdx+1}</b> / ${quizOrder.length}</span>
    </div>
    <div class="q-num">Q${String(quizIdx+1).padStart(2,'0')}.</div>
    ${videoEmbedHtml(q)}
    <div class="q-text">${escapeHtml(q.text)}</div>
    <div class="choice-row" id="choiceRow">
      <button class="choice-btn o" data-v="O">O</button>
      <button class="choice-btn x" data-v="X">X</button>
    </div>
  `;
  document.querySelectorAll('#choiceRow .choice-btn').forEach(btn=>{
    btn.onclick = () => answer(btn.dataset.v, q);
  });
}

function videoEmbedHtml(q){
  if(!q.video || !q.video.id) return '';
  const start = q.video.start || 0;
  const end = q.video.end || (start + 5);
  const src = `https://www.youtube-nocookie.com/embed/${q.video.id}?start=${start}&end=${end}&autoplay=1&mute=1&playsinline=1&rel=0&modestbranding=1`;
  const watchUrl = `https://www.youtube.com/watch?v=${q.video.id}&t=${start}s`;
  return `
    <div class="video-badge">🎬 영상 문제</div>
    <div class="video-wrap"><iframe src="${src}" title="quiz video" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <div style="text-align:center; margin:-8px 0 16px;"><a href="${watchUrl}" target="_blank" rel="noopener" style="font-size:12px; color:var(--ink-soft);">영상이 안 보이면 여기를 눌러 유튜브에서 보기 ↗</a></div>
  `;
}

function answer(val, q){
  if(answeredCurrent) return;
  answeredCurrent = true;
  const correct = val === q.answer;
  if(correct) score++;

  solveBody.innerHTML = `
    <div class="score-row">
      <span>SCORE <b>${score}</b> / ${quizIdx+1}</span>
      <span>문제 <b>${quizIdx+1}</b> / ${quizOrder.length}</span>
    </div>
    <div class="q-num">Q${String(quizIdx+1).padStart(2,'0')}.</div>
    ${videoEmbedHtml(q)}
    <div class="q-text">${escapeHtml(q.text)}</div>
    <div class="stamp-zone">
      <div class="stamp ${correct?'correct':'wrong'}">${correct?'O':'X'}</div>
      <div class="feedback-text">
        ${correct ? '정답이에요!' : `틀렸어요. 정답은 <b>${q.answer}</b> 입니다.`}
        ${q.explanation ? `<br>${escapeHtml(q.explanation)}` : ''}
      </div>
    </div>
    <button class="next-btn" id="btnNext">${quizIdx+1 < quizOrder.length ? '다음 문제 →' : '결과 보기 →'}</button>
  `;
  document.getElementById('btnNext').onclick = () => {
    quizIdx++;
    answeredCurrent = false;
    renderSolve();
  };
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---- Manage tab ----
function renderList(){
  listTitle.textContent = `등록된 문제 (${questions.length})`;
  if(questions.length === 0){
    qList.innerHTML = `<div class="empty-state" style="padding:18px 4px;">등록된 문제가 없어요. 위 폼으로 첫 문제를 추가해보세요.</div>`;
    return;
  }
  qList.innerHTML = questions.map(q => `
    <div class="q-item" data-id="${q.id}">
      <div class="badge ${q.answer==='O'?'o':'x'}">${q.answer}</div>
      <div class="body">
        <div class="qt">${escapeHtml(q.text)} ${q.video ? '<span class="video-badge" style="margin-left:4px;">🎬</span>' : ''}</div>
        ${q.explanation ? `<div class="expl">${escapeHtml(q.explanation)}</div>` : ''}
      </div>
      <button class="del" data-id="${q.id}">삭제</button>
    </div>
  `).join('');
  qList.querySelectorAll('.del').forEach(btn=>{
    btn.onclick = () => deleteQuestion(btn.dataset.id);
  });
}

async function deleteQuestion(id){
  questions = questions.filter(q => q.id !== id);
  renderList();
  const ok = await saveQuestions();
  addStatus.textContent = ok ? '삭제됐어요.' : '삭제 저장에 실패했어요. 다시 시도해주세요.';
  setTimeout(()=> addStatus.textContent = '', 2200);
}

document.getElementById('btnPickO').onclick = () => setPick('O');
document.getElementById('btnPickX').onclick = () => setPick('X');
function setPick(v){
  picked = v;
  document.getElementById('btnPickO').className = v==='O' ? 'sel-o' : '';
  document.getElementById('btnPickX').className = v==='X' ? 'sel-x' : '';
}

function extractYoutubeId(url){
  if(!url) return null;
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

function spiderPassAnim(){
  return `
    <div class="spider-anim">
      <svg viewBox="0 0 200 140" class="web-burst">
        <g stroke="#B23A2E" stroke-width="1.6" fill="none" opacity="0.55">
          <line x1="100" y1="70" x2="100" y2="4"/>
          <line x1="100" y1="70" x2="152" y2="18"/>
          <line x1="100" y1="70" x2="196" y2="70"/>
          <line x1="100" y1="70" x2="152" y2="122"/>
          <line x1="100" y1="70" x2="100" y2="136"/>
          <line x1="100" y1="70" x2="48" y2="122"/>
          <line x1="100" y1="70" x2="4" y2="70"/>
          <line x1="100" y1="70" x2="48" y2="18"/>
          <circle cx="100" cy="70" r="22" opacity="0.5"/>
          <circle cx="100" cy="70" r="42" opacity="0.35"/>
        </g>
      </svg>
      <div class="spider-emoji">🕷️</div>
    </div>`;
}

function spiderFailAnim(){
  return `
    <div class="spider-anim">
      <svg viewBox="0 0 200 100" class="web-torn">
        <g stroke="#8a8578" stroke-width="1.6" fill="none" opacity="0.5">
          <line x1="100" y1="50" x2="90" y2="6"/>
          <line x1="100" y1="50" x2="150" y2="24"/>
          <line x1="100" y1="50" x2="180" y2="70"/>
          <line x1="100" y1="50" x2="60" y2="94"/>
          <line x1="100" y1="50" x2="16" y2="60"/>
          <line x1="100" y1="50" x2="40" y2="10"/>
        </g>
      </svg>
      <div class="spider-emoji" style="filter:grayscale(1); opacity:.7;">🕸️</div>
    </div>`;
}

document.getElementById('btnAdd').onclick = async () => {
  const text = document.getElementById('inputQuestion').value.trim();
  const expl = document.getElementById('inputExpl').value.trim();
  const videoUrl = document.getElementById('inputVideoUrl').value.trim();
  const videoStartRaw = document.getElementById('inputVideoStart').value.trim();
  const videoEndRaw = document.getElementById('inputVideoEnd').value.trim();
  if(!text){ addStatus.textContent = '문제 내용을 입력해주세요.'; return; }
  if(!picked){ addStatus.textContent = '정답(O 또는 X)을 선택해주세요.'; return; }

  let video = null;
  if(videoUrl){
    const vid = extractYoutubeId(videoUrl);
    if(!vid){
      addStatus.textContent = '유튜브 링크 형식을 확인해주세요.';
      return;
    }
    const start = parseInt(videoStartRaw, 10) || 0;
    const end = parseInt(videoEndRaw, 10) || (start + 5);
    video = { id: vid, start, end };
  }

  const newQ = {
    id: 'q_' + Date.now() + '_' + Math.floor(Math.random()*1000),
    text, answer: picked, explanation: expl, video
  };
  questions.push(newQ);
  renderList();
  document.getElementById('inputQuestion').value = '';
  document.getElementById('inputExpl').value = '';
  document.getElementById('inputVideoUrl').value = '';
  document.getElementById('inputVideoStart').value = '';
  document.getElementById('inputVideoEnd').value = '';
  picked = null;
  document.getElementById('btnPickO').className = '';
  document.getElementById('btnPickX').className = '';

  addStatus.textContent = '저장 중...';
  const ok = await saveQuestions();
  addStatus.textContent = ok ? '문제가 추가됐어요.' : '저장에 실패했어요. 다시 시도해주세요.';
  setTimeout(()=> addStatus.textContent = '', 2200);
};

document.getElementById('btnReset').onclick = async () => {
  if(!confirm('현재 목록을 지우고 기본 문제(스파이더맨 문제 세트)로 되돌릴까요?')) return;
  questions = DEFAULT_QUESTIONS.slice();
  renderList();
  const ok = await saveQuestions();
  addStatus.textContent = ok ? '기본 문제로 초기화됐어요.' : '초기화 저장에 실패했어요.';
  setTimeout(()=> addStatus.textContent = '', 2200);
};

// ---- Manage lock ----
const MANAGE_PW = '1234';
let unlocked = false;

document.getElementById('btnUnlock').onclick = tryUnlock;
document.getElementById('inputPw').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') tryUnlock();
});

function tryUnlock(){
  const pwStatus = document.getElementById('pwStatus');
  const val = document.getElementById('inputPw').value;
  if(val === MANAGE_PW){
    unlocked = true;
    document.getElementById('manageLock').style.display = 'none';
    document.getElementById('manageCard').style.display = 'block';
    document.getElementById('inputPw').value = '';
    pwStatus.textContent = '';
  }else{
    pwStatus.textContent = '비밀번호가 올바르지 않아요.';
  }
}

// ---- Tabs ----
document.querySelectorAll('.tab').forEach(tab=>{
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    const isSolve = tab.dataset.tab === 'solve';
    document.getElementById('solveCard').style.display = isSolve ? 'block' : 'none';
    document.querySelector('.torn').style.display = isSolve ? 'block' : 'none';

    if(isSolve){
      document.getElementById('manageLock').style.display = 'none';
      document.getElementById('manageCard').style.display = 'none';
      startQuiz();
    }else{
      if(unlocked){
        document.getElementById('manageCard').style.display = 'block';
      }else{
        document.getElementById('manageLock').style.display = 'block';
        document.getElementById('inputPw').focus();
      }
    }
  };
});

// ---- Init ----
(async function init(){
  solveBody.innerHTML = `<div class="empty-state">불러오는 중...</div>`;
  await loadQuestions();
  renderList();
  startQuiz();
})();
</script>
</body>
</html>
